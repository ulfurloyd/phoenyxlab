apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
  namespace: media
  labels:
    app: suwayomi
    app.kubernetes.io/name: suwayomi
    app.kubernetes.io/instance: suwayomi
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
        app.kubernetes.io/name: suwayomi
        app.kubernetes.io/instance: suwayomi
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: suwayomi
          image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
          env:
            - name: TZ
              value: Asia/Kolkata
          ports:
            - containerPort: 4567
          livenessProbe:
            tcpSocket:
              port: 4567
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 4567
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /home/suwayomi/.local/share/Tachidesk
            - name: manga
              mountPath: /home/suwayomi/.local/share/Tachidesk/downloads
      initContainers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          restartPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: "none"
            - name: TZ
              value: Asia/Kolkata
          ports:
            - containerPort: 8191
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: suwayomi-config
        - name: manga
          hostPath:
            path: /media/manga
