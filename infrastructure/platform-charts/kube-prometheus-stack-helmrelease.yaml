apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: monitoring
spec:
    interval: 30m
    chart:
        spec:
            chart: kube-prometheus-stack
            version: 92.11.0
            sourceRef:
                kind: HelmRepository
                name: prometheus-community
                namespace: flux-system
    values:
        alertmanager:
            enabled: true
            alertmanagerSpec:
                secrets:
                    - alertmanager-secret
            config:
                global: {}
                route:
                    receiver: discord
                    group_by:
                        - alertname
                        - severity
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 12h
                receivers:
                    - name: "null"
                    - name: discord
                      discord_configs:
                        - webhook_url: ENC[AES256_GCM,data:z07snhOxuBo8XabwEgvQIDtyaiRN8L2YVgi1yqiV+awgBvm9NRFAPdR2RANwpZazv9BNfzTDFpGuY44VmU03puNrA1/FZC3FfHYBVj26/0M5S79ulOTvOjky13tZoAAR55Sq7Vai9EC4xjoDSCvmD7FnTblLlYGUGg==,iv:OXfJR3RvqDI3nkMCXACc6BoOlNkdkQ6Mm2PBxf1EFYU=,tag:e+IZjMmArDL3GjhRm5OUjg==,type:str]
                          send_resolved: true
                          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                          message: |
                            {{ range .Alerts }}
                            **Severity:** {{ .Labels.severity }}
                            **Summary:** {{ .Annotations.summary }}
                            {{ .Annotations.description }}
                            {{ end }}
            ingress:
                enabled: true
                ingressClassName: traefik
                hosts:
                    - alertmanager.phoenyxlab.xyz
                tls:
                    - hosts:
                        - alertmanager.phoenyxlab.xyz
        cAdvisor:
            enabled: true
        kubeApiServer:
            serviceMonitor:
                interval: 60s
                metricRelabelings:
                    - action: drop
                      regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
                      sourceLabels:
                        - __name__
                        - le
                    - action: drop
                      regex: apiserver_(request_body_size_bytes_bucket|response_sizes_bucket|watch_list_duration_seconds_bucket|watch_cache_read_wait_seconds_bucket|watch_events_sizes_bucket|admission_controller_admission_duration_seconds_bucket)
                      sourceLabels:
                        - __name__
                    - action: drop
                      regex: apiserver_flowcontrol_.*
                      sourceLabels:
                        - __name__
        kubeStateMetrics:
            enabled: true
        kubelet:
            serviceMonitor:
                interval: 60s
        grafana:
            enabled: true
            adminUser: wolf
            adminPassword: ENC[AES256_GCM,data:YgE2oRBh8yN5bVI=,iv:z2xkmc/n7o0yhWNR45GXdEgFYXITjk2huLOPOuY99Iw=,tag:KjMPmEnvVCxt7Ub8YgGUNQ==,type:str]
            persistence:
                enabled: true
                type: pvc
                existingClaim: kube-prometheus-stack-grafana
                size: 10Gi
                accessModes:
                    - ReadWriteOnce
            ingress:
                enabled: true
                ingressClassName: traefik
                hosts:
                    - grafana.phoenyxlab.xyz
                tls:
                    - hosts:
                        - grafana.phoenyxlab.xyz
        prometheus:
            enabled: true
            ingress:
                enabled: true
                ingressClassName: traefik
                hosts:
                    - prometheus.phoenyxlab.xyz
                tls:
                    - hosts:
                        - prometheus.phoenyxlab.xyz
            prometheusSpec:
                resources:
                    requests:
                        cpu: 250m
                        memory: 512Mi
                    limits:
                        memory: 1Gi
        prometheus-node-exporter:
            enabled: true
        kubeProxy:
            enabled: false
        kubeControllerManager:
            enabled: false
        kubeScheduler:
            enabled: false
